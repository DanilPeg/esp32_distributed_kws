verification_local:
  - "py_compile clean on every new .py module (ensemble_recipes, aggregation, build_ensemble_notebook, hash_ensemble_sim, test_aggregator_match)."
  - "Notebook builder regenerates a 17-cell .ipynb; every code cell ast.parse-clean."
  - "ensemble_recipes built end-to-end: 3 recipes verified to differ only in PW codebooks and seed; compact params 8780/9804/10828, virtual 72832 across all three (MAC budget identical)."
  - "aggregation.evaluate_aggregators on synthetic data: best single 0.76 → mean_logits 0.84, mean_probs 0.89, temperature_scaled 0.89, learned_weights 0.90, oracle 0.92 — sanity correct."
  - "C++ aggregator compiles with g++ 9.2 -Wall -Wextra; six fixed-vector cases (mean_logits / temperature_scaled / learned_weights, including disagreement scenarios) match numpy reference labels."
  - "Host simulator smoke run (no checkpoints) on 30 synthetic samples writes node{1,2,3}/events.jsonl + decisions.jsonl + cluster/state.json under the same paths the live dashboard already reads; ensemble top1 = 30/30 on the easy synthetic split."
  - "PS1 variant selector dry-run errors out cleanly when bundles don't exist yet — informative message."
verification_pending:
