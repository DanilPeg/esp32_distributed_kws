entry_id: 2026-05-09_hash_ensemble_implementation_001
date: '2026-05-09'
domain: ml
topic: hash_ensemble_3_models_implementation_landed
status: code_done_pending_colab_run
summary: |
  Locked plan v2 (notes/Journal/2026-05-09_hash_ensemble_plan.md) implemented
  end-to-end except for the actual Colab training run. Three near-homogeneous
  HashedNet KWS recipes are wired (only PW codebooks and seed differ); a Colab
  notebook trains them with shared teacher + cached logits, evaluates 7
  aggregators (incl. new temperature-scaled mean and learned 3-weight head),
  and exports per-variant firmware bundles. Host simulator + MCU C++
  aggregator + PS1 variant selector are landed; numpy and C++ aggregators
  agree on 6 fixed test vectors.
inputs:
  baseline_recipe: hn95_kd128_layerwise_signed_residual
  baseline_test_acc_user_reported: 0.9325
  research_source: code/analysis/hash_ensemble/NOTES.md
decisions_implemented:
  - "Plan v2 switch: from hetero-K (per-node small/base/large) to near-homo (PW-perturbed) for accuracy."
  - "Three variants ens_a/ens_b/ens_c: identical stem/DW/linear codebooks (512/(288,256,224,192)/512), only PW shifts -20%/baseline/+13% and seed varies (13/29/47)."
  - "Single teacher trained once (anchored to ens_b); the other two students reload the same checkpoint via TEACHER_CHECKPOINT_PATH and reuse cached logits via the existing fingerprint-keyed cache."
  - "Headline aggregator stays mean_logits per research; added two new ones — per-model temperature scaling fitted on val, and softmax-parameterized 3-weight head trained on val with manual numpy SGD."
  - "Holdout discipline: calibration / learned weights only ever see the validation split."
