risks_carried_forward:
  - "Cached teacher logits cache key includes feature/dataset+teacher fingerprint. As long as the three students share the same teacher checkpoint and same feature/dataset config (they do), the cache is reused. If a future change perturbs feature/dataset, the cache gets rebuilt for each student — slow but correct."
  - "MCU aggregator uses Q8.8 transport for score/margin int16; numbers match numpy by label, not by exact float (documented in test harness)."
