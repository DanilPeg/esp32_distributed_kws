sergey_branch_review:
  branch: docs/audio-demo-sergey
  commit: 6c81c01 "feat: mic1/mic2 distributed network nodes"
  takeaways:
    - "Sergey built a PlatformIO project with mic1/mic2/coordinator/cam, with the coordinator role running an AsyncWebSocket dashboard ON the ESP32 itself. Useful for diploma demos that want zero-host operation."
    - "His shared protocol (InferencePacket, 74 bytes) carries top-3 textual labels with 0-100 score — sufficient for human-readable dashboards but throws away the raw logits we need for mean_logits / temperature_scaled / learned_weights aggregation. We keep the existing 12-int8-logit packet for that reason."
    - "Adopted local: Serial.begin() before first printf — already followed; WIFI_CHANNEL=11 — left at 1 by default but exposed as a build flag (HASH_KWS_ESPNOW_CHANNEL)."
    - "Stub mode (USE_HASH_KWS_MODEL=0) — good idea, leaving it as a TODO for the master sketch (it can already accept packets with no model on board)."
verification:
  - "py_compile clean on all touched files."
  - "C++ aggregator parity test (test_aggregator_match.py) still passes after copying aggregator_params.h next to the master sketch."
  - "deploy/ tree manually verified to contain all 4 reports + 3×student_best.pt + 3×firmware_export/."
  - "Each hash_kws_runtime_ens_<x>/ contains 14 files (variant-specific hash_model_data.cpp + metadata + 12 shared scaffolding files). hash_model_data.cpp differs across variants (PW codebooks 1024 / 1280 / 1536 first-block sizes confirmed by file head)."
  - "Repo root cleaned: ens_{a,b,c}/, ensemble_results.json, aggregator_params.h, aggregator_comparison.png, pairwise_disagreement.png removed (originals preserved under code/deploy/hash_ensemble/)."
risks_carried_forward:
  - "Master sketch validates packet via CRC16 + magic — but it copies the struct definition by hand. If micro_speech.ino later changes HashKwsEspNowPacket layout, master must be updated in lockstep. Mitigated by a doc comment at the top of the master .ino."
  - "Variant runtime overlays embed copies of shared scaffolding (hash_kws_runner.cpp etc.). If the runtime is bug-fixed in code/firmware/hash_kws_runtime/, the variant overlays drift. Documented in VARIANTS.md."
  - "We rely on val/test discipline from the notebook for calibration parameters. Re-running aggregator fitting must use the same val split — already enforced inside aggregation.fit_*."
