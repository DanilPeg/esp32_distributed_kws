entry_id: 2026-05-09_hash_ensemble_deploy_001
date: '2026-05-09'
domain: ml
topic: hash_ensemble_3_models_trained_and_deployed_locally
status: ready_for_real_mcu_run
summary: |
  Colab training of the three near-homo hash KWS students completed. Bundle
  unpacked into the repo, then reorganised into a clean deploy/ tree and
  parallel firmware-runtime variants. Master role lives on a separate (4th)
  ESP32: minimal sketch added at code/firmware/hash_kws_master/. Best
  aggregator on test is essentially a tie among mean_logits / mean_probs /
  temperature_scaled / learned_weights at ~0.9425; chosen mean_logits as the
  default for deployment (cheapest on MCU, no exp).
