interpretation: |
  Ensemble lifts best-single from 0.9323 to 0.9429 (+1.06 p.p.), inside the
  +1.5–2.5 p.p. baggin band predicted by the prior research. All five
  "smart" aggregators land within a 0.20 p.p. window of mean_logits — exactly
  the "smart-aggregators-do-not-buy-much" finding from
  code/analysis/hash_ensemble/NOTES.md §7.4. Learned weights converge to
  ~uniform (0.333 / 0.333 / 0.333), confirming risk #5 from the v2 plan: when
  three models are near-equally calibrated the learned head provides nothing
  over plain averaging — and we report this as a positive negative result.
  Per-class disagreement is highest on phonetically close pairs (no/go) and
  on `down` — diploma-relevant material for the discussion section.
chosen_aggregator: mean_logits
chosen_aggregator_reason: |
  mean_probs is +0.058 p.p. (within seed noise from the dispersion measurement
  ~0.07 p.p.). mean_logits requires no exp() on the master MCU and matches the
  research headline. Calibration / learned-weight paths are kept available in
  the firmware aggregator behind compile-time HASH_KWS_AGG_MODE.
