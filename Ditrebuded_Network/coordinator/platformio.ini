[env:esp32wroom]
platform  = espressif32@6.7.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; На ESP32-WROOM-32 нет WS2812 — есть синий светодиод на GPIO2.
; neopixelWrite туда пишет, но цвета не покажет — это нормально,
; LED используется только как статус-индикатор.
build_flags =
    -DLED_RGB_PIN=2

lib_deps =
    mathieucarbou/ESPAsyncWebServer
    bblanchon/ArduinoJson

; Partition scheme with enough app space for web server + JSON
; board_build.partitions = huge_app.csv

; PSRAM — enable if your board has it
; board_build.arduino.memory_type = qio_opi
; board_build.psram = enabled
