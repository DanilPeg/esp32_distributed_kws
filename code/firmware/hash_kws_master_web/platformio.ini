; PlatformIO project configuration — hash_kws_master_web
;
; Two envs available:
;   * wroom32 — original master on an ESP32 WROOM-32 (Xtensa LX6, dual-core).
;   * c3_mini — master on an ESP32-C3-MINI-1 module (RISC-V, single-core,
;               native USB CDC, GPIO8 LED on most dev boards).
;
; Build either env explicitly:
;   pio run -e wroom32
;   pio run -e c3_mini
; ...or both at once with bare `pio run`. Default is wroom32.
;
; Before building, copy these files next to platformio.ini:
;   hash_ensemble_aggregator.h   ← from code/firmware/hash_kws_aggregator/
;   aggregator_params.h          ← from code/deploy/hash_ensemble/reports/
;
; And into src/:
;   src/hash_ensemble_aggregator.cpp ← from code/firmware/hash_kws_aggregator/
;
; NOTE: build_dir is redirected to C:/pio_build to avoid SCons failures
; caused by Cyrillic characters and spaces in the project path. Each env
; gets its own subdirectory under build_dir automatically.

[platformio]
build_dir    = C:/pio_build/hash_kws_master_web
default_envs = wroom32

; ─── Shared settings reused by both envs ────────────────────────────────────
[common]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
; Use ESP32Async fork — required for ESP32 core 3.x (me-no-dev does NOT compile).
; ArduinoJson is pinned to v6 because v7's heavier template usage triggers
; `Illegal instruction` (AMO opcode) on ESP32-C3 — that chip is RV32IMC with
; NO atomic extension, and v7's std-lib-flavoured paths emit atomics via
; libstdc++. v6 stays safe on both Xtensa and RISC-V cores.
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson @ ^6.21.0
build_flags =
    -std=gnu++17
    -fpermissive
    -I ${PROJECT_DIR}
    -DHASH_KWS_ESPNOW_CHANNEL=1
    -DHASH_KWS_AGG_MODE=0

; ─── ESP32 WROOM-32 (original target) ───────────────────────────────────────
[env:wroom32]
platform      = espressif32
board         = esp32dev
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
lib_deps      = ${common.lib_deps}
build_flags   = ${common.build_flags}

; ─── ESP32-C3-MINI-1 (new master target) ────────────────────────────────────
; Pick `esp32-c3-devkitm-1` as the closest official board profile for the
; C3-MINI-1 module — same SoC, same flash size, same partition layout.
;
; C3 specifics:
;   * RV32IMC, NO atomic extension. Any AMO/LR/SC instruction triggers
;     "Illegal instruction" panic (MCAUSE=2). Symptom: random reboot on
;     first JSON serialize / WS push / heap-thrashy operation. Mitigations:
;       - Use ArduinoJson v6 (set in [common]), not v7.
;       - Pin platform to a known-good build of espressif32 (below).
;       - Avoid std::atomic / std::mutex in user code (we don't have any).
;   * Native USB CDC — must enable ARDUINO_USB_MODE / CDC_ON_BOOT or Serial
;     output won't appear over the USB-C port at all.
;   * Single core — code is fine (no FreeRTOS pinning anywhere in main.cpp).
;   * Most dev boards expose an LED on GPIO8 (active LOW on several
;     Espressif-branded boards, active HIGH on bare-module breakouts).
;     If your LED doesn't blink, flip the polarity, override the pin via
;     -DHASH_KWS_LED_PIN=<n>, or disable with -DHASH_KWS_LED_PIN=-1.
;   * Do NOT pass -DLED_BUILTIN=<n> — the Arduino-ESP32 3.x variant header
;     declares LED_BUILTIN as `static const uint8_t LED_BUILTIN = ...;`,
;     so a command-line define collides with the C++ declaration and the
;     build fails with "expected unqualified-id before numeric constant".
;     Use HASH_KWS_LED_PIN instead — main.cpp routes the LED through it.
;   * ESP-NOW + AsyncWebServer + ArduinoJson work the same as on WROOM-32.
[env:c3_mini]
; Pin the platform — newer espressif32 builds sometimes ship libs that
; emit AMO on C3 (see the "RV32IMC, NO atomic extension" note above).
; 6.10.0 ships arduino-esp32 3.0.7 which boots cleanly on the C3-MINI-1
; with this codebase. Bump only after you've verified on hardware.
platform      = espressif32 @ 6.10.0
board         = esp32-c3-devkitm-1
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
lib_deps      = ${common.lib_deps}
build_flags   =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHASH_KWS_LED_PIN=8
    ; ISA selection is intentionally NOT overridden — the espressif32 6.10
    ; toolchain ships an older GCC that doesn't understand the modern
    ; `_zicsr_zifencei` suffix in -march. The board-default `rv32imc`
    ; (no atomic extension) is what we want anyway, so let PlatformIO
    ; pick it from the `board = esp32-c3-devkitm-1` profile.
