; PlatformIO project configuration — hash_kws_master_web
; Board: ESP32 WROOM-32  (ESP32 Dev Module)
;
; Before building, copy these files next to platformio.ini:
;   hash_ensemble_aggregator.h   ← from code/firmware/hash_kws_aggregator/
;   aggregator_params.h          ← from code/deploy/hash_ensemble/reports/
;
; And into src/:
;   src/hash_ensemble_aggregator.cpp ← from code/firmware/hash_kws_aggregator/
;
; NOTE: build_dir is redirected to C:/pio_build to avoid SCons failures
; caused by Cyrillic characters and spaces in the project path.

[platformio]
build_dir = C:/pio_build/hash_kws_master_web

[env:wroom32]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Add project root to include path so headers next to platformio.ini are found
build_flags =
    -std=gnu++17
    -fpermissive
    -I ${PROJECT_DIR}
    -DHASH_KWS_ESPNOW_CHANNEL=1
    -DHASH_KWS_AGG_MODE=0

; Use ESP32Async fork — required for ESP32 core 3.x (me-no-dev does NOT compile)
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson @ ^7.0.0
