; mic1 - First microphone inference node (ESP32-S3 + INMP441)
;
; Two build modes are exposed:
;
;   pio run -e esp32s3            -> stub mode (USE_HASH_KWS_MODEL=0).
;                                    Sends fake top-3 over ESP-NOW in the
;                                    same InferencePacket format as cam/
;                                    and micro/. Useful to validate the
;                                    network layer without flashing the
;                                    full hash-KWS model.
;
;   pio run -e esp32s3-hashkws    -> real inference mode (USE_HASH_KWS_MODEL=1).
;                                    Pulls the trained 9128 model and the
;                                    audio frontend from
;                                    ../../../Моедли/board1_model_9128_node1/
;                                    via lib_extra_dirs. Requires the fix
;                                    to hash_model_data.h documented in
;                                    MICROPHONES.md.

[env]
platform     = espressif32@6.7.0
board        = esp32-s3-devkitc-1
framework    = arduino
monitor_speed = 115200

[env:esp32s3]
build_flags =
    -DLED_RGB_PIN=48
    -DUSE_HASH_KWS_MODEL=0
    -DMIC_NODE_INDEX=1

[env:esp32s3-hashkws]
; tanakamasayuki/TensorFlowLite_ESP32 repo was deleted.
; Replaced with the official tflite-micro-arduino-examples port.
lib_deps =
    https://github.com/tensorflow/tflite-micro-arduino-examples
build_flags =
    -DLED_RGB_PIN=48
    -DUSE_HASH_KWS_MODEL=1
    -DMIC_NODE_INDEX=1
    -DUSE_FAKE_MIC=0
    -O3
