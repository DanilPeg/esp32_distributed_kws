; PlatformIO project configuration — hash_kws_master_web (unified master).
;
; Two build targets, same source:
;   pio run -e wroom32 -t upload      ; ESP32 WROOM-32 (Xtensa LX6)
;   pio run -e c3_mini  -t upload     ; ESP32-C3-MINI-1  (RISC-V)
;
; PlatformIO auto-installs libraries from lib_deps -- no Arduino Library
; Manager dance required.
;
; ArduinoJson is pinned to v6 in [common] because v7 (heavier std-lib paths)
; emits AMO instructions on ESP32-C3, which doesn't have the RISC-V atomic
; extension -- the chip panics with "Illegal instruction" on first JSON
; serialize. v6 stays safe on BOTH Xtensa (WROOM-32) and RISC-V (C3).
;
; build_dir is redirected outside the project tree to avoid SCons issues
; with non-ASCII characters or spaces in the Windows path.

[platformio]
build_dir    = C:/pio_build/hash_kws_master_web
src_dir      = .
default_envs = wroom32

[common]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
; ESP32Async fork (formerly mathieucarbou) -- required for ESP32 core 3.x.
; The legacy me-no-dev fork does NOT compile against core 3.x.
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson @ ^6.21.0
build_flags =
    -std=gnu++17
    -fpermissive
    -I ${PROJECT_DIR}
    ; ── WiFi credentials (override at the command line via
    ;    -DHASH_KWS_STA_SSID=\"x\" or edit here) ─────────────────────────────
    -DHASH_KWS_STA_SSID=\"Big_Frog_Fi\"
    -DHASH_KWS_STA_PASS=\"Ceploplastic27\"
    ; ── ESP-NOW channel — MUST match the channel of the WiFi router the
    ;    master is connecting to (in STA mode the radio is locked to the
    ;    router's channel — you can't override that from code). And the
    ;    inference nodes MUST be compiled with the same channel.
    ;    Find router channel: `netsh wlan show interfaces` on Windows,
    ;    look at the "Channel" line. Then set it here AND in the inference
    ;    nodes' build flags (`-DHASH_KWS_ESPNOW_CHANNEL=N`), and reflash.
    -DHASH_KWS_ESPNOW_CHANNEL=1
    ; ── Force AP mode (no STA, no router). Master raises its own WiFi on
    ;    HASH_KWS_ESPNOW_CHANNEL above. Useful when:
    ;      (a) you can't / don't want to reflash audio nodes to match the
    ;          router's channel
    ;      (b) the router's channel is fixed by IT / regulation
    ;    Connect your laptop / phone to "KWS-Master" / "kwsmaster1" WiFi,
    ;    open http://192.168.4.1/ . Comment this line out to go back to
    ;    STA primary + AP fallback.
    -DHASH_KWS_WIFI_MODE=0
    ; ── Aggregator mode: 0=mean_logits, 1=temperature_scaled, 2=learned_weights
    -DHASH_KWS_AGG_MODE=0
    ; ── mDNS hostname → http://<MDNS_HOSTNAME>.local/
    ;    Distinct from Sergey's old master (micro_network.local) so both can
    ;    co-exist on the same LAN without mDNS collision.
    -DMDNS_HOSTNAME=\"kws_master\"

; ─── ESP32 WROOM-32 (canonical master target) ───────────────────────────────
[env:wroom32]
platform      = espressif32
board         = esp32dev
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
lib_deps      = ${common.lib_deps}
build_flags   = ${common.build_flags}

; ─── ESP32-C3-MINI-1 (alternative master target) ────────────────────────────
; Notes:
;   * RISC-V, NO atomic extension. ArduinoJson must be v6 (pinned in [common]).
;   * Native USB CDC — must enable ARDUINO_USB_MODE / CDC_ON_BOOT or Serial
;     output won't appear over the USB-C port.
;   * Most C3-MINI dev boards expose an LED on GPIO8. If the LED doesn't
;     blink, your board may have inverse polarity or no LED at all — set
;     -DHASH_KWS_LED_PIN=-1 to disable. (Our sketch uses LED_RGB_PIN=48 by
;     default for S3; the C3 mapping is optional.)
;   * Platform is pinned to 6.10.0 because newer espressif32 builds sometimes
;     ship libs that emit AMO on C3 (see ArduinoJson note above). 6.10.0
;     ships arduino-esp32 3.0.7 which boots cleanly on the C3-MINI-1 with
;     this codebase. Bump only after verifying on hardware.
[env:c3_mini]
platform      = espressif32 @ 6.10.0
board         = esp32-c3-devkitm-1
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
; Slow but rock-solid. C3-MINI boards drop USB partway through large
; uploads on cheap cables / hub setups; 115200 trades 30 s of wait for
; not having to retry. Bump back to 460800 / 921600 only after you've
; confirmed your cable + direct USB port reliably finish at speed.
upload_speed  = 115200
lib_deps      = ${common.lib_deps}
build_flags   =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_RGB_PIN=8
